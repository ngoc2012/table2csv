<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 380px; font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 10px; }
      #status { margin: 0 0 8px; color: #333; }
      table { border-collapse: collapse; width: 100%; font-size: 11px; margin-bottom: 8px; }
      th, td {
        border: 1px solid #ddd;
        padding: 3px 5px;
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      th { background: #f4f4f4; text-align: left; }
      button {
        width: 100%;
        padding: 6px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        margin-bottom: 6px;
      }
      #scanBtn { background: #1d3557; color: #fff; }
      #scanBtn:hover { background: #142844; }
      #exportBtn { display: none; background: #e63946; color: #fff; }
      #exportBtn:hover { background: #d62839; }
    </style>
  </head>
  <body>
    <p id="status">Click Scan to detect a list/table on this page.</p>
    <button id="scanBtn">Scan Page</button>
    <div id="preview"></div>
    <button id="exportBtn">Export CSV</button>
    <script src="popup.js"></script>
  </body>
</html>
